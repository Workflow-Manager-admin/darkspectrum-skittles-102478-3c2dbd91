<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gradient/rainbow "Skittles" logo for ColorCraft Skittles.
  Designed for dark mode with layered glassy and glowing effects.
-->
<svg
  width="44"
  height="44"
  viewBox="0 0 44 44"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Main rainbow arc gradient -->
    <linearGradient id="rainbow-arc" x1="6" y1="38" x2="38" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e87a41"/>
      <stop offset="0.20" stop-color="#e0ce31"/>
      <stop offset="0.39" stop-color="#48e043"/>
      <stop offset="0.61" stop-color="#2b9ef1"/>
      <stop offset="0.81" stop-color="#7751e5"/>
      <stop offset="1" stop-color="#f34aac"/>
    </linearGradient>
    <!-- Soft glowing shadow under arc -->
    <radialGradient id="rainbow-shadow" cx="22" cy="34" r="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fe0bd55" offset="0"/>
      <stop stop-color="#23292800" offset="1"/>
    </radialGradient>
    <!-- White highlight streak for glass shine -->
    <linearGradient id="highlight" x1="6" y1="18" x2="38" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.09"/>
    </linearGradient>
    <!-- Outer circular glow -->
    <radialGradient id="outer-glow" cx="22" cy="22" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fe0bd40" offset="0"/>
      <stop stop-color="#4da37633" offset="0.7"/>
      <stop stop-color="#23292800" offset="1"/>
    </radialGradient>
  </defs>
  <!-- Outer soft glow -->
  <circle cx="22" cy="22" r="21.2" fill="url(#outer-glow)"/>
  <!-- Glassy black background -->
  <circle cx="22" cy="22" r="18.5" fill="#16181e" fill-opacity="0.93" />
  <!-- Rainbow arc main -->
  <path
    d="M35 30 Q28 13 9 26"
    stroke="url(#rainbow-arc)"
    stroke-width="6.5"
    stroke-linecap="round"
    filter="url(#arc-shadow)"
  />
  <!-- Rainbow arc soft shadow -->
  <ellipse
    cx="22" cy="34" rx="13.5" ry="6.7"
    fill="url(#rainbow-shadow)" fill-opacity="0.98"
  />
  <!-- Glass highlight line across arc -->
  <path
    d="M13 26 Q21 19 31 27"
    stroke="url(#highlight)"
    stroke-width="1.85"
    stroke-linecap="round"
    opacity="0.87"
  />
  <!-- Skittle sphere in focus (center, glassy) -->
  <circle
    cx="22" cy="25"
    r="4.2"
    fill="url(#rainbow-arc)"
    stroke="#FFF" stroke-width="0.9"
    style="filter: drop-shadow(0 2px 8px #8fe0bd80);"
  />
  <!-- 'S' Letter for Skittles, white/gradient shadow, bold, glass effect -->
  <text
    x="22"
    y="27.2"
    text-anchor="middle"
    font-family="Inter, Arial Black, Helvetica, sans-serif"
    font-weight="bold"
    font-size="4.7"
    fill="#fff"
    stroke="#4da376"
    stroke-width="0.27"
    paint-order="stroke"
    style="letter-spacing: 0.09em; filter: drop-shadow(0 1px 5px #41685788);"
    opacity="0.98"
    alignment-baseline="middle"
    dominant-baseline="middle"
  >S</text>
  <!-- Minor lens glare for extra shine -->
  <ellipse cx="25.3" cy="22.6" rx="1.12" ry="0.42" fill="#fff" fill-opacity="0.24"/>
  <!-- Glossy ring on sphere -->
  <ellipse cx="20.8" cy="26.1" rx="1.14" ry="0.33" fill="#fff" fill-opacity="0.26"/>
</svg>
