<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rainbow swirl - multi-segment gradient -->
  <defs>
    <linearGradient id="rainbowGrad" x1="4" y1="40" x2="40" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fa237a"/>
      <stop offset="12%" stop-color="#f97a26"/>
      <stop offset="26%" stop-color="#ffd422"/>
      <stop offset="42%" stop-color="#67e422"/>
      <stop offset="56%" stop-color="#15ccb9"/>
      <stop offset="72%" stop-color="#1979fa"/>
      <stop offset="85%" stop-color="#8329fb"/>
      <stop offset="100%" stop-color="#fa237a"/>
    </linearGradient>
    <radialGradient id="shine" cx="18" cy="12" r="25" gradientTransform="matrix(1.3 0 0 0.8 0 0)" gradientUnits="userSpaceOnUse">
      <stop offset="0.13" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff00" stop-opacity="0"/>
    </radialGradient>
    <filter id="bgblur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rainbow path -->
  <path
    d="M8,36
      Q12,12 36,12
      Q34,30 14,32
      Z"
    fill="url(#rainbowGrad)"
    filter="url(#bgblur)"
    opacity="0.97"
  />
  <!-- Skittle candies (simple, bright colored circles) -->
  <circle cx="15" cy="30" r="3.2" fill="#fa237a" stroke="#fff" stroke-width="1.1"/>
  <circle cx="22.8" cy="20.2" r="3.1" fill="#ffd422" stroke="#fff" stroke-width="1.1"/>
  <circle cx="28.6" cy="16.7" r="2.7" fill="#67e422" stroke="#fff" stroke-width="1"/>
  <circle cx="32" cy="22" r="2.3" fill="#15ccb9" stroke="#fff" stroke-width="0.9"/>
  <circle cx="25.2" cy="30.3" r="2.4" fill="#f97a26" stroke="#fff" stroke-width="1"/>
  <!-- S letter: ColorCraft/Skittles identity, glowing accent -->
  <text x="11.1" y="26.8" font-family="Inter, Arial Black, Arial,sans-serif" font-size="18" font-weight="900"
      fill="url(#rainbowGrad)" stroke="#fff" stroke-width="0.8" letter-spacing="-0.09em"
      filter="url(#bgblur)">
    S
  </text>
  <!-- Specular shine -->
  <ellipse cx="21" cy="17" rx="11" ry="4.1" fill="url(#shine)" opacity="0.53"/>
  <!-- Outer glow for logo integration with dark backgrounds -->
  <ellipse cx="22" cy="22" rx="20" ry="20" fill="none" stroke="url(#rainbowGrad)" stroke-width="0.55"
    filter="url(#bgblur)" opacity="0.2"/>
</svg>
